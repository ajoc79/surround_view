[package]
name = "surround-view"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
wgpu = { version = "27.0.1", default-features = false, features = ["vulkan", "dx12", "wgsl"] }
rfd = "0.15"
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["webgpu", "wgsl"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Document", "Window"] }
